<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Extension Manager</title>
        <link rel="stylesheet" href="./dist/output.css">
    </head>

    <body class="p-4">
        <div class="container h-full p-4 border rounded-2xl" id="calculator">
            <input class="bg-olive-800 w-full h-24 mb-4 rounded-lg"
                id="display" readonly>
            <div class=" grid grid-cols-4 gap-3" id="keys">
                <button
                    class="bg-amber-400 rounded-full h-12 w-12 justify-self-center"
                    id="plus">+</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="seven">7</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="eight">8</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="nine">9</button>
                <button
                    class="bg-amber-400 rounded-full h-12 w-12 justify-self-center"
                    id="minus">-</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="four">4</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="five">5</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="six">6</button>
                <button
                    class="bg-amber-400 rounded-full h-12 w-12 justify-self-center"
                    id="multiply">*</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="one">1</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="two">2</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="three">3</button>
                <button
                    class="bg-amber-400 rounded-full h-12 w-12 justify-self-center"
                    id="divide">/</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="zero">0</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="point">.</button>
                <button
                    class="rounded-full bg-olive-800 h-12 w-12 justify-self-center text-white"
                    id="equals">=</button>
                <button
                    class="bg-amber-400 rounded-full h-12 w-12 justify-self-center"
                    id="clear">C</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
